name: "release-holochain-binaries"
on:
  workflow_call:
    inputs:
      holochain-branch:
        required: true
        type: string
      x86_64-pc-windows-msvc:
        required: false
        default: true
        type: boolean
      aarch64-apple-darwin:
        required: false
        default: true
        type: boolean
      x86_64-apple-darwin:
        required: false
        default: true
        type: boolean
      x86_64-unknown-linux-gnu:
        required: false
        default: true
        type: boolean
      aarch64-unknown-linux-gnu:
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      holochain-branch:
        required: true
        type: string
        description: "Holochain branch name to build from"
      x86_64-pc-windows-msvc:
        required: false
        default: false
        type: boolean
        description: "Build for Windows x86_64"
      aarch64-apple-darwin:
        required: false
        default: false
        type: boolean
        description: "Build for macOS ARM64"
      x86_64-apple-darwin:
        required: false
        default: false
        type: boolean
        description: "Build for macOS x86_64"
      x86_64-unknown-linux-gnu:
        required: false
        default: false
        type: boolean
        description: "Build for Linux x86_64"
      aarch64-unknown-linux-gnu:
        required: false
        default: false
        type: boolean
        description: "Build for Linux ARM64"

jobs:
  publish-holochain-binaries:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Checks out a copy of your repository on the ubuntu-latest machine
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: install Go stable
        uses: actions/setup-go@v4
        with:
          go-version: "stable"

      - name: Set version strings
        id: version
        run: |
          # Sanitize branch name for use in tags and filenames (replace / with -)
          SANITIZED_BRANCH=$(echo "${{ inputs.holochain-branch }}" | tr '/' '-')
          echo "full_version=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          echo "branch=${{ inputs.holochain-branch }}" >> $GITHUB_OUTPUT
        shell: bash

      - id: create-release
        uses: ncipollo/release-action@v1
        with:
          body: |
            Holochain binaries for Linux.
            Built from branch: ${{ inputs.holochain-branch }}
          prerelease: true
          skipIfReleaseExists: true
          tag: holochain-binaries-${{ steps.version.outputs.full_version }}

      - name: setup binaries (x86_64-unknown-linux-gnu)
        if: inputs.x86_64-unknown-linux-gnu == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install holochain binary from git branch
          cargo install holochain --git https://github.com/holochain/holochain --branch ${{ inputs.holochain-branch }} --locked --no-default-features --features sqlite-encrypted,wasmer_sys,backend-go-pion
          HOLOCHAIN_PATH=$(which holochain)
          cp $HOLOCHAIN_PATH holochain-${{ steps.version.outputs.full_version }}-x86_64-unknown-linux-gnu

          shasum -a 256 holochain-${{ steps.version.outputs.full_version }}-x86_64-unknown-linux-gnu

          gh release upload "holochain-binaries-${{ steps.version.outputs.full_version }}" "holochain-${{ steps.version.outputs.full_version }}-x86_64-unknown-linux-gnu"
